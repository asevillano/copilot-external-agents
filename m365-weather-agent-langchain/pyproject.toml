[tool.pytest.ini_options]
testpaths = ["weather-agent/tests", "bridge/tests"]
pythonpath = ["weather-agent", "bridge"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", "data", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
