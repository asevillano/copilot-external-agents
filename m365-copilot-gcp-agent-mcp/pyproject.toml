[tool.pytest.ini_options]
testpaths = ["mcp-server/tests", "bridge/tests"]
pythonpath = ["mcp-server", "bridge"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "data", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
